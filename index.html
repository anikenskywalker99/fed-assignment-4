<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css" />
		<title>Hockey Survey</title>
    </head>
    <body>
        <form id="hockeySurvey" action="https://httpbin.org/post" method="post">
			<h1 aria-label="Hockey Survey">Hockey Survey</h1>
            <fieldset>
                <legend aria-label="Personal Information">Personal Information:</legend>
                <div class="input-container">
                    <label for="name" aria-label="Name">Name:</label>
                    <input type="text" id="name" name="name" />
                </div>
                <div class="input-container">
                    <label for="age" aria-label="Age">Age:</label>
                    <input type="range" id="age" name="age" min="0" max="120">
                </div>
                <div>
                    <label for="province" aria-label="Province or Territory">Province/ Territory:</label>
                    <select name="province" id="province">
                        <option value="">--Please choose an option--</option>
                        <option value="ab">Alberta</option>
                        <option value="bc">British Columbia</option>
                        <option value="mb">Manitoba</option>
                        <option value="nb">New Brunswick</option>
                        <option value="nl">Newfoundland & Labrador</option>
                        <option value="nt">Northwest Territories</option>
                        <option value="ns">Nova Scotia</option>
                        <option value="nu">Nunavut</option>
                        <option value="on">Ontario</option>
                        <option value="pe">Prince Edward Island</option>
                        <option value="qc">Quebec</option>
                        <option value="sk">Saskatchewan</option>
                        <option value="yt">Yukon</option>
                    </select>
                </div>
                <div class="input-container">
                    <label for="email" aria-label="Email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="input-container">
                    <label for="phone" aria-label="Phone Number">Phone Number:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </fieldset>
            <fieldset>
                <legend aria-label="Favourite Team">Favourite Team:</legend>
                <div>
                    <input type="radio" id="canucks" name="teams">
                    <label for="canucks" aria-label="Canucks">Vancouver Canucks</label>
                </div>
                <div>
                    <input type="radio" id="oilers" name="teams">
                    <label for="oilers" aria-label="Oilers">Edmonton Oilers</label>
                </div>
                <div>
                    <input type="radio" id="flames" name="teams">
                    <label for="flames" aria-label="Flames">Calgary Flames</label>
                </div>
                <div>
                    <input type="radio" id="jets" name="teams">
                    <label for="jets" aria-label="Jets">Winnipeg Jets</label>
                </div>
                <div>
                    <input type="radio" id="sens" name="teams">
                    <label for="sens" aria-label="Senators">Ottawa Senators</label>
                </div>
                <div>
                    <input type="radio" id="leafs" name="teams">
                    <label for="leafs"  aria-label="Maple Leafs">Toronto Maple Leafs</label>
                </div>
                <div>
                    <input type="radio" id="canadiens" name="teams">
                    <label for="canadiens" aria-label="Canadiens">Montreal Canadiens</label>
                </div>
            </fieldset>
            <fieldset>
                <legend aria-label="Check What You Use">Check What You Use:</legend>
                <div>
                    <input type="checkbox" id="sock-tape" name="sock-tape">
                    <label for="sock-tape" aria-label="Sock Tape">Sock Tape</label>
                </div>
                <div>
                    <input type="checkbox" id="mouthguard" name="mouthguard">
                    <label for="mouthguard" aria-label="Mouthguard">Mouthguard</label>
                </div>
                <div>
                    <input type="checkbox" id="visor" name="visor">
                    <label for="visor" aria-label="Visor">Visor</label>
                </div>
                <div>
                    <input type="checkbox" id="jersey-tuck" name="jersey-tuck">
                    <label for="jersey-tuck"  aria-label="Jersey Tuck">Jersey Tuck</label>
                </div>
                <div>
                    <input type="checkbox" id="tongue-tuck" name="tongue-tuck">
                    <label for="tongue-tuck"  aria-label="Skate Tongue Tuck">Skate Tongue Tuck</label>
                </div>
            </fieldset>
            <fieldset>
                <legend aria-label="First Game">First Game:</legend>
                    <label for="first-game"  aria-label="When was your first game">When Was Your First Game:</label>
                    <input type="date" id="first-game" name="first-game">
            </fieldset>
            <div class="submit">
                <button type="submit">Submit</button>
            </div>
		</form>
		<script src="script.js"></script>
    </body>
</html>
